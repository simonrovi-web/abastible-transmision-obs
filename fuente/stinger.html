var Q=new URLSearchParams(location.search),MODE=Q.get('m')||'ola',TOTAL=+(Q.get('total')||4);
function cl(x){return Math.max(0,Math.min(1,x))}
function eio(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function ei(x){x=cl(x);return x*x*x}

function wavePanel(x,col,amp,ph,dir){var p='M-200 -50 L'+x+' -50 ';for(var y=-50;y<=1130;y+=30){var xx=x+Math.sin(y/140+ph)*amp;p+='L'+xx.toFixed(1)+' '+y+' '}p+='L-200 1130 Z';

  s+='</svg>';h+=s;
  var li=eo((T-.42)/.3),lo=ei((T-(o-.05))/.25),sc=.85+.15*li+.12*lo;
